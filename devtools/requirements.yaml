setup:
  channels: &setup_channels
    - uibcdf
    - conda-forge
  dependencies: &setup_dependencies
    - python
    - pip
    - setuptools >=61.0
    - versioningit ~=2.0

production:
  channels: &production_channels
    - *setup_channels
  dependencies: &production_dependencies
    - python
    - numpy
    - scipy
    - pyunitwizard
    - smonitor
    - argdigest
    - depdigest

test:
  channels: &test_channels
    - *production_channels
  dependencies: &test_dependencies
    - *production_dependencies
    - scikit-learn
    - pytest
    - pytest-cov
    - pytest-xdist
    - pyyaml >=6
    - jinja2 >=3,<4
    - packaging >=24
    - numba
    - ruff ==0.16.5
    - codecov

docs:
  channels: &docs_channels
    - *production_channels
  dependencies: &docs_dependencies
    - *production_dependencies
    - scikit-learn
    - pyyaml >=6
    - jinja2 >=3,<4
    - packaging >=24
    - sphinx
    - sphinx_rtd_theme
    - sphinxcontrib-bibtex
    - sphinx-remove-toctrees
    - sphinx-copybutton
    - myst-nb
    - tqdm
    - matplotlib
    - jupyterlab

development:
  channels:
    - *production_channels
  dependencies:
    - *production_dependencies
    - *test_dependencies
    - *docs_dependencies
    - mamba

conda-build:
  channels:
    - *setup_channels
  dependencies:
    - *setup_dependencies
    - anaconda-client
    - conda-build
