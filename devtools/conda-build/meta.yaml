package:
  name: lindelint
  version: "{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}"
source:
  path: ../../
build:
  number: {{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  string: py_{{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  noarch: python
requirements:
  host:
    - python >=3.11,<3.15
    - pip
    - setuptools >=61.0
    - versioningit ~=2.0
  run:
    - python >=3.11,<3.15
    - numpy
    - scipy
    - pyunitwizard
    - smonitor
    - argdigest
    - depdigest
    - scikit-learn
test:
  imports:
    - lindelint
  commands:
    - python -c "import importlib.metadata; assert importlib.metadata.version('lindelint') == '{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}'"
about:
  home: https://uibcdf.org
  license: MIT License
  summary: ''
  description: 'Linear Delaunay Interpolator

    '
  dev_url: https://github.com/uibcdf/lindelint
  doc_url: https://uibcdf.org/lindelint
