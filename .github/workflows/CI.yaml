name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * MON"
    - cron: "43 1 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      probe_backlog:
        description: Check skipped-commit debt without running the matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '43 1 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py

  governance:
    name: Reporting governance on Linux Python 3.14
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Validate report records and generated indexes
      run: python devtools/devguide_index.py --check
    - name: Test the reporting guard
      run: python -m unittest discover -s tests -p test_reporting_protocol.py

  test:
    needs: nightly-decision
    if: >-
      always() && inputs.probe_backlog != true
      && (github.event_name != 'schedule' || github.event.schedule != '43 1 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    name: Test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false  # do not cancel all in-progress jobs if any job variation fails
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.11"}
          - { os: ubuntu-latest, python-version: "3.12"}
          - { os: ubuntu-latest, python-version: "3.13"}
          - { os: ubuntu-latest, python-version: "3.14"}
          - { os: macos-15,  python-version: "3.11"}
          - { os: macos-15,  python-version: "3.12"}
          - { os: macos-15,  python-version: "3.13"}
          - { os: macos-15,  python-version: "3.14"}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
            - ambermd
          channel_priority: strict

        create-args: >-
          python=${{ matrix.cfg.python-version }}

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Verify built wheel includes runtime packages
      shell: bash -l {0}
      run: |
        python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/lindelint-wheel"
        python devtools/scripts/check_wheel.py "$RUNNER_TEMP/lindelint-wheel/"*.whl

    - name: Test import module
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        trap 'echo "::endgroup::"' EXIT
        cd
        pwd
        python -c 'import lindelint; print("Version of the package: {}".format(lindelint.__version__))'

    - name: Verify interpreter and macOS architecture
      shell: bash -l {0}
      env:
        EXPECTED_PYTHON: ${{ matrix.cfg.python-version }}
      run: |
        set -euo pipefail
        python - <<'PYTHON'
        import os
        import platform
        import sys
        assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]
        if sys.platform == "darwin":
            assert platform.machine() == "arm64", platform.machine()
        print("Python", platform.python_version(), "architecture", platform.machine())
        PYTHON

    - name: Run tests
      shell: bash -l {0}
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest -n logical -v --cov-config=.coveragerc --cov=lindelint --cov-report=xml --junitxml=junit.xml --color=yes

    - name: Run Ruff lint
      shell: bash -l {0}
      run: ruff check .

    - name: Check Ruff formatting
      shell: bash -l {0}
      run: ruff format --check .

    - name: Check coverage
      shell: bash -l {0}
      run: |
        cat ./coverage.xml

    - name: Upload coverage reports to Codecov
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.cfg.os }}-py${{ matrix.cfg.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: ${{ matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13' && !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
