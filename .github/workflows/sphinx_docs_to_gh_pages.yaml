name: Documentation

on:
  release:
    types: ['released']

  workflow_dispatch:

env:
  SPHINXWORKING: True

jobs:
  sphinx_docs_to_gh-pages:
    runs-on: ubuntu-latest
    name: Sphinx docs to gh-pages
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Check out the reviewed distribution SDK
        uses: actions/checkout@v4
        with:
          repository: uibcdf/molsyssuite
          ref: 38db709ecc07451ff36ea84573d585f9af6b4df7
          path: .molsyssuite
          persist-credentials: false

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
              - defaults
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate docs
          micromamba info
          micromamba list

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Check distribution inputs
        shell: bash -l {0}
        run: python devtools/check_distribution_inputs.py --suite-root .molsyssuite

      - name: Test import module
        shell: bash -l {0}
        run: |
          set -euo pipefail
          echo "::group::Importing module from home directory"
          trap 'echo "::endgroup::"' EXIT
          cd
          pwd
          python -c 'import lindelint; print("Version of the package: {}".format(lindelint.__version__))'

      - name: Running the Sphinx to gh-pages Action
        uses: uibcdf/action-sphinx-docs-to-gh-pages@v2.1.0
